name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:
  # Co poniedziałek odświeża rozkłady autobusów i dane okolicy (data/transit.js, data/poi.js) i publikuje stronę ponownie
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Testy Playwright (tests/): każdy push, przed publikacją
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: tests
      - run: npx playwright install --with-deps chromium
        working-directory: tests
      - run: npx playwright test
        working-directory: tests
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/playwright-report
          retention-days: 7

  deploy:
    needs: test
    # Publikuj tylko z domyślnej gałęzi repozytorium
    if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Wymaga: Settings → Pages → Source: GitHub Actions
      - uses: actions/configure-pages@v5
      - name: Odśwież rozkłady autobusów (GTFS)
        # Przy błędzie źródła zostaje wersja data/transit.js z repozytorium
        continue-on-error: true
        run: python3 tools/import_transit.py
      - name: Odśwież okolicę z OpenStreetMap (kultura, sklepy, stacje, apteki)
        continue-on-error: true
        run: python3 tools/import_poi.py
      - name: Przygotuj pliki strony
        run: |
          mkdir -p _site
          cp -r index.html .nojekyll sw.js img data css fonts js _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
